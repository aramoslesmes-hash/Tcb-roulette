<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roulette des Lots — Tennis Club Bellegarde</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap');

  :root {
    --tcb-blue: #1a6bbd;
    --tcb-blue-dark: #0f4a8a;
    --tcb-yellow: #f0c822;
    --tcb-yellow-dark: #c9a500;
    --tcb-black: #111111;
    --tcb-white: #ffffff;
    --tcb-gray: #f4f4f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--tcb-black);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 0 1rem 3rem;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(26,107,189,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 30%, rgba(240,200,34,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 1.5rem;
    position: relative;
    z-index: 1;
  }

  .logo-wrap {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid var(--tcb-yellow);
    overflow: hidden;
    box-shadow: 0 0 30px rgba(240,200,34,0.3);
    margin-bottom: 1rem;
    background: #111;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: 4px;
    color: var(--tcb-white);
    text-align: center;
    line-height: 1;
  }

  .header-sub {
    font-size: 13px;
    color: var(--tcb-yellow);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 0.4rem;
    text-align: center;
  }

  .divider {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, var(--tcb-blue), var(--tcb-yellow));
    border-radius: 2px;
    margin: 1rem auto 0;
  }

  /* Main card */
  .card {
    width: 100%;
    max-width: 700px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 2rem 1.5rem;
    position: relative;
    z-index: 1;
    backdrop-filter: blur(8px);
  }

  /* Wheel layout */
  .wheel-layout {
    display: flex;
    gap: 2rem;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .wheel-container {
    position: relative;
    flex-shrink: 0;
  }

  canvas#wheel {
    display: block;
    filter: drop-shadow(0 4px 20px rgba(26,107,189,0.4));
  }

  .wheel-arrow {
    position: absolute;
    top: 50%;
    right: -20px;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 16px solid transparent;
    border-bottom: 16px solid transparent;
    border-right: 28px solid var(--tcb-yellow);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  /* Side panel */
  .side-panel {
    flex: 1;
    min-width: 200px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  /* Spin button */
  .spin-btn {
    width: 100%;
    padding: 16px 20px;
    background: var(--tcb-yellow);
    color: var(--tcb-black);
    border: none;
    border-radius: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .spin-btn:hover:not(:disabled) {
    background: var(--tcb-yellow-dark);
    transform: translateY(-1px);
  }

  .spin-btn:active:not(:disabled) { transform: scale(0.98); }

  .spin-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .spin-btn svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  /* Result box */
  .result-box {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 1.25rem 1rem;
    text-align: center;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.4s ease;
  }

  .result-label {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .result-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 1.5px;
    color: var(--tcb-white);
    line-height: 1.2;
  }

  /* Lots list */
  .lots-section {
    margin-top: 0.5rem;
  }

  .lots-title {
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 0.6rem;
  }

  .lot-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: rgba(255,255,255,0.65);
    padding: 3px 0;
    line-height: 1.3;
  }

  .lot-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Count */
  .spin-count {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    text-align: center;
    letter-spacing: 1px;
    margin-top: -4px;
  }

  /* Footer */
  footer {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
  }

  /* Tennis ball deco */
  .deco-ball {
    position: fixed;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 2px solid rgba(240,200,34,0.06);
    pointer-events: none;
    z-index: 0;
  }
  .deco-ball.b1 { top: -30px; right: -30px; width: 200px; height: 200px; }
  .deco-ball.b2 { bottom: 50px; left: -40px; opacity: 0.5; }

  /* Animation */
  @keyframes winner-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  .result-box.winner {
    animation: winner-pulse 0.4s ease 2;
  }

  @media (max-width: 520px) {
    .wheel-layout { flex-direction: column; }
    .side-panel { width: 100%; }
  }
</style>
</head>

<script>
const LOTS = [
  { label: "-10% stages adultes",     color: "#1a6bbd" },
  { label: "-10% stages enfants",     color: "#2d8fd6" },
  { label: "-10% adhésion 2026-27",   color: "#0f4a8a" },
  { label: "Boîte de balles tournoi", color: "#f0c822" },
  { label: "Conso gratuite",          color: "#2db56b" },
  { label: "Cadeau surprise",         color: "#8b5cf6" },
  { label: "Pas de chance…",          color: "#555555" },
  { label: "Retente ta chance !",     color: "#888888" },
];

const WEIGHTS = [10, 10, 8, 14, 18, 7, 18, 15];

function weightedRandom() {
  const total = WEIGHTS.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < WEIGHTS.length; i++) {
    r -= WEIGHTS[i];
    if (r <= 0) return i;
  }
  return WEIGHTS.length - 1;
}

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const W = 280, R = W / 2 - 8, cx = W / 2, cy = W / 2;
const arcSize = (2 * Math.PI) / LOTS.length;

let currentAngle = -Math.PI / 2;
let spinning = false;
let spinCount = 0;

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawWheel(angle) {
  ctx.clearRect(0, 0, W, W);

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, R + 6, 0, 2 * Math.PI);
  ctx.fillStyle = '#1a1a1a';
  ctx.fill();

  for (let i = 0; i < LOTS.length; i++) {
    const start = angle + i * arcSize;
    const end = start + arcSize;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, start, end);
    ctx.closePath();
    ctx.fillStyle = LOTS[i].color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + arcSize / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = '500 10.5px DM Sans, sans-serif';

    const maxW = R - 28;
    const lines = wrapText(ctx, LOTS[i].label, maxW);
    const lineH = 13;
    const startY = -(lines.length - 1) * lineH / 2;
    lines.forEach((l, li) => ctx.fillText(l, R - 12, startY + li * lineH + 3));
    ctx.restore();
  }

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 22, 0, 2 * Math.PI);
  ctx.fillStyle = '#f0c822';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#111';
  ctx.font = '700 9px DM Sans, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('TCB', cx, cy);
}

function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  const rv = document.getElementById('resultValue');
  rv.textContent = '…';

  const winner = weightedRandom();
  const targetMid = -winner * arcSize - arcSize / 2 - Math.PI / 2;
  const extraSpins = (4 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
  const finalAngle = targetMid - (currentAngle % (2 * Math.PI)) + currentAngle + extraSpins;

  const duration = 4000;
  const start = performance.now();
  const startA = currentAngle;

  function ease(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    currentAngle = startA + (finalAngle - startA) * ease(t);
    drawWheel(currentAngle);
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      spinCount++;
      document.getElementById('spinBtn').disabled = false;

      rv.textContent = LOTS[winner].label;
      const box = document.getElementById('resultBox');
      box.style.background = LOTS[winner].color + '33';
      box.style.borderColor = LOTS[winner].color + '66';
      box.classList.remove('winner');
      void box.offsetWidth;
      box.classList.add('winner');

      if (spinCount > 0) {
        document.getElementById('spinCount').textContent = spinCount + ' tour' + (spinCount > 1 ? 's' : '') + ' effectué' + (spinCount > 1 ? 's' : '');
      }
    }
  }
  requestAnimationFrame(frame);
}

drawWheel(currentAngle);

// Build lots list
const lotsList = document.getElementById('lotsList');
LOTS.forEach(l => {
  const div = document.createElement('div');
  div.className = 'lot-item';
  div.innerHTML = `<div class="lot-dot" style="background:${l.color}"></div><span>${l.label}</span>`;
  lotsList.appendChild(div);
});
</script>
</body>
